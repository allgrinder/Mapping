# KRITIS-Lagekarte: SPA aus public/, /api an index.php (Slim). Gleiche Sicherheits-Header wie das Backend (SecurityHeaders.php).
ServerTokens Prod
ServerSignature Off
TraceEnable Off
ServerName localhost

<VirtualHost *:8080>
    DocumentRoot /app/backend/public
    LimitRequestBody 10485760

    <Directory /app/backend/public>
        Options -Indexes -MultiViews
        AllowOverride None
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteRule ^/api/ /index.php [L,QSA]
    # vorhandene Dateien direkt, alles andere an die App (Hash-Routing, index.html)
    RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} !-f
    RewriteRule ^ /index.html [L]

    <LocationMatch "/\.">
        Require all denied
    </LocationMatch>
    <FilesMatch "\.php$">
        <If "%{REQUEST_URI} !~ m#^/api/#">
            Require all denied
        </If>
    </FilesMatch>

    Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "same-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()"
    Header always set Cross-Origin-Opener-Policy "same-origin"

    <Location "/sw.js">
        Header set Cache-Control "no-cache"
    </Location>
    # App-Hülle (auch wenn sie über / oder eine Unterseite ausgeliefert wird) nie veraltet aus dem Cache
    Header set Cache-Control "no-cache" "expr=%{REQUEST_FILENAME} =~ m#/index\.html$#"
    <Location "/assets/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </Location>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
