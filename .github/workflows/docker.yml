# Baut das Anwendungs-Image (Dockerfile) und legt es in GitHub Packages ab:
#   ghcr.io/allgrinder/mapping:latest   (und :sha-<commit>)
# Auf Unraid/Docker-Host: einmalig `docker login ghcr.io` (Token mit read:packages), dann `docker compose pull && docker compose up -d`.
name: Docker-Image

on:
  push:
    branches: [main, claude/vigilant-mccarthy-o1vnp1]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-image
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Image-Name (Kleinbuchstaben)
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.title=KRITIS-Lagekarte NRW
          cache-from: type=gha
          cache-to: type=gha,mode=max
