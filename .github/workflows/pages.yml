# Baut die Demo-Version (Backend läuft im Browser) und veröffentlicht sie auf GitHub Pages.
# Die Verwaltungsgrenzen werden beim Bauen frisch von Geobasis NRW geladen (dl-de/zero-2.0).
name: Demo auf GitHub Pages

on:
  push:
    branches: [main, claude/vigilant-mccarthy-o1vnp1]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip, mbstring
          tools: composer:v2

      - name: PHP-Abhängigkeiten
        working-directory: backend
        run: composer install --no-dev --no-interaction --prefer-dist

      - name: Verwaltungsgrenzen (DVG2) laden und als GeoJSON exportieren
        run: |
          URL=$(php -r '$s = require "config/services.php"; echo $s["boundaries"]["dvg2"]["url"];')
          if curl -fsSL --retry 3 -o /tmp/dvg2.zip "$URL"; then
            php backend/bin/export-geojson.php --dvg=/tmp/dvg2.zip --out=frontend/demo-public/demo-data
          else
            echo "::warning::DVG-Download fehlgeschlagen – Demo wird ohne Grenzdaten gebaut."
          fi

      - name: PLZ-Gebiete NRW aus OpenStreetMap (Overpass, ODbL)
        run: |
          if php backend/bin/import-plz-osm.php --demo-out=frontend/demo-public/demo-data; then
            php -r '$m = json_decode(file_get_contents("frontend/demo-public/demo-data/meta.json"), true); echo "PLZ5: ", $m["levels"]["plz5"] ?? 0, " Gebiete, OSM-Stand ", $m["plz"]["osmBase"] ?? "-", PHP_EOL;'
          else
            echo "::warning::PLZ-Abruf (Overpass) fehlgeschlagen – Demo wird ohne PLZ-Gebiete gebaut."
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Demo bauen
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build:demo

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist-demo

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
